---
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - JELLYFIN_PublishedServerUrl=http://$HOSTNAME #optional
    volumes:
      - config:/config
      - /mnt/14TB/Movies:/Movies
      - /mnt/14TB/TV:/TV
    ports:
      - 8096:8096
      - 8920:8920 #optional
      - 7359:7359/udp #optional
      - 1900:1900/udp #optional
    restart: unless-stopped
volumes:
  config:
    # The config volume lives on the big disk, not on / (moved 2026-09-14).
    # NOTE: the directory must exist and be owned by PUID/PGID (1000:1000)
    # before the volume is first created, or the app cannot write to it.
    driver: local
    driver_opts:
      type: none
      device: /mnt/HG12TB/docker/jellyfin/config
      o: bind

